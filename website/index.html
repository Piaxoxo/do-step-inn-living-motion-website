<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do Step Inn Living — Wohnen auf Zeit in Wien</title>
    <meta name="description" content="Moderne, voll ausgestattete Apartments für Kurzzeitaufenthalte in Wien — flexibel, planbar, unkompliziert." />
    <meta name="theme-color" content="#FFFFFF" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FFFFFF'/><circle cx='16' cy='16' r='7' fill='%2300875F'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Buchungsmaschine (uphotel.agency). Laedt laut Betreiberentscheidung
         sofort, ohne Einwilligungsschranke. Das Stylesheet steht hier statt im
         Body, damit die Maske nicht ungestylt aufblitzt; das Skript laedt am
         Ende des Body, wie vom Anbieter vorgegeben. Der preconnect spart den
         Verbindungsaufbau zur Fremddomain, der sonst vor dem ersten Byte der
         Maske steht. -->
    <link rel="preconnect" href="https://ibe.uphotel.agency" crossorigin />
    <link href="https://ibe.uphotel.agency/ibe.min.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="text/javascript" src="https://ibe.uphotel.agency/ibe.min.js"></script>
  </body>
</html>
